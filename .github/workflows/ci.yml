name: CI

# Pull requests run the checks; docker-image.yml calls this before building on master
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: jdx/mise-action@v5.2.7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build typechecks too
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
