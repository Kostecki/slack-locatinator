services:
  locatinator:
    image: ghcr.io/kostecki/slack-locatinator:latest
    restart: unless-stopped
    container_name: slack-locatinator
    hostname: slack-locatinator
    ports:
      - ${APP_PORT:-3000}:3000
    environment:
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      SLACK_OAUTH_TOKEN: ${SLACK_OAUTH_TOKEN}
      TZ: ${TZ}
